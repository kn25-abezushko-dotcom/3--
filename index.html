<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій магазин</title>
    <link rel="stylesheet" href="123123.css">
</head>
<body>

    <!-- Хедер сайту -->
    <header class="header">
        <a href="#" class="logo">МІЙ <span>МАГАЗИН</span></a>

        <nav class="menu">
            <a href="#">Головна</a>
            <a href="#">Магазин</a>
            <a href="#">Питання</a>
            <a href="#">Про нас</a>
            <a href="#">Контакти</a>
            <button class="login">Увійти</button>
        </nav>
    </header>

    <!-- Головний екран (Hero section) -->
    <main class="hero">
        <div class="hero-text">
            <h1>
                Ласкаво просимо
                <strong>до нашого магазину!</strong>
            </h1>

            <p>
                Наш магазин пропонує широкий вибір товарів і послуг. Ви можете переглядати
                асортимент та робити покупки через інтернет.
            </p>

            <div class="buttons">
                <a href="#" class="button black">КУПИТИ ЗАРАЗ</a>
                <a href="#" class="button white">ЗВ'ЯЗАТИСЯ</a>
            </div>
        </div>

        <div class="hero-image">
            <img src="https://images.unsplash.com/photo-1472851294608-062f824d29cc?auto=format&fit=crop&w=700&q=80" alt="Ілюстрація інтернет-магазину">
        </div>
    </main>

    <!-- Блок прокрутки вниз -->
    <div class="scroll">
        <p>Гортайте вниз</p>
        <span>⌄</span>
    </div>

</body>
</html>
